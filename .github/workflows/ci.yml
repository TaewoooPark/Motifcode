name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The TypeScript gate, in the order a failure is cheapest to read: types,
  # then the artifact, then behaviour.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported range, both ends. A harness that only works on the
        # version its author happens to run is not a supported range.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — package.json's `packageManager` field
      # is the single source of truth, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `build` used to print "no build step yet" and exit 0, so nothing ever
      # established that the installable artifact starts.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint:tools

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # A real tensor backend. Without it the slicing test — the one path that
      # decides whether a pruned checkpoint is correct — skipped on every
      # commit, and "24 passed, 1 skipped" read as coverage.
      - run: pip install -r toolkit/requirements-dev.txt
      # The vendor's modelling code, pinned. It is not vendored into this
      # repository — it would drift from upstream the moment it was copied —
      # but without it the equivalence test, which is the one that decides
      # whether the profiler's forward pass is the model's, silently skips.
      - name: fetch the reference architecture
        run: |
          pip install "huggingface_hub>=1.0"
          hf download Motif-Technologies/Motif-3 modeling_motif.py configuration_motif.py \
            --revision "$MOTIF_3_REVISION" --local-dir toolkit/ref
        env:
          # Pinned, like every other revision here. `main` would let an
          # upstream architecture change alter what the equivalence test
          # compares against, without a commit in this repository.
          MOTIF_3_REVISION: 883d5c441fe3bb994c7b57e60f49e26147f85512
      - name: unit tests, with skipping forbidden
        env:
          MOTIF_REQUIRE_TORCH: "1"
          MOTIF_REQUIRE_REFERENCE: "1"
        run: python -m unittest discover -s toolkit/prune -p 'test_*.py' -v

  # The goldens are committed so the TypeScript job can run without Python.
  # This job proves the goldens themselves are still what the real template
  # produces.
  goldens-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r toolkit/requirements-dev.txt
      - run: python toolkit/fixtures/gen_template_golden.py
      - run: git diff --exit-code corpus/template-golden/

  # ARM64 is where this actually deploys — a GB10 is aarch64. The bug that
  # motivated `killGroup` only appeared on Linux, and only in CI.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
